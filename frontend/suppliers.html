<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suppliers | Medistock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>html,body{background:#f4f6fc}</style>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body" data-page-title="Suppliers" data-page-sub="Vendors, lead times and the medicines they supply">
    <div class="app-shell">
        <aside class="app-sidebar" id="appSidebar"></aside>

        <div class="app-main">
            <header class="app-topbar">
                <button class="app-burger" id="appBurger" aria-label="Toggle navigation">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="app-topbar-title">
                    <h1 id="appPageTitle">Suppliers</h1>
                    <p id="appPageSub">Vendors, lead times and the medicines they supply</p>
                </div>
                <div class="app-topbar-actions">
                    <span class="app-live"><span class="app-live-dot"></span> Live</span>
                    <span class="app-clock" id="appClock"></span>
                    <a class="app-icon-btn" href="cart.html" title="Cart"><i class="fas fa-cart-shopping"></i></a>
                    <a class="app-icon-btn" href="reports.html" title="Reports"><i class="fas fa-chart-line"></i></a>
                </div>
            </header>

            <main class="app-content">
                <div class="page-toolbar">
                    <div>
                        <h2><i class="fas fa-truck-medical"></i> Supplier Network</h2>
                        <p>Every vendor linked to the medicines they deliver</p>
                    </div>
                    <div class="toolbar-actions">
                        <button class="btn-ghost" id="exportSuppliers" type="button"><i class="fas fa-file-csv"></i> Export CSV</button>
                        <button class="btn-brand" id="addSupplierBtn" type="button" data-admin-only><i class="fas fa-plus"></i> Add Supplier</button>
                    </div>
                </div>

                <section class="kpi-grid">
                    <article class="kpi-card k-indigo">
                        <div class="kpi-top">
                            <span class="kpi-icon"><i class="fas fa-truck-medical"></i></span>
                            <span class="kpi-trend">network</span>
                        </div>
                        <div class="kpi-value" id="kpiSuppliers">0</div>
                        <div class="kpi-label">Suppliers</div>
                        <div class="kpi-bar"><span class="kpi-bar-fill" id="kpiSuppliersBar"></span></div>
                        <div class="kpi-foot" id="kpiSuppliersFoot">&nbsp;</div>
                    </article>

                    <article class="kpi-card k-teal">
                        <div class="kpi-top">
                            <span class="kpi-icon"><i class="fas fa-circle-check"></i></span>
                            <span class="kpi-trend">active</span>
                        </div>
                        <div class="kpi-value" id="kpiActive">0</div>
                        <div class="kpi-label">Active Vendors</div>
                        <div class="kpi-bar"><span class="kpi-bar-fill" id="kpiActiveBar"></span></div>
                        <div class="kpi-foot" id="kpiActiveFoot">&nbsp;</div>
                    </article>

                    <article class="kpi-card k-violet">
                        <div class="kpi-top">
                            <span class="kpi-icon"><i class="fas fa-link"></i></span>
                            <span class="kpi-trend">linked</span>
                        </div>
                        <div class="kpi-value" id="kpiLinked">0</div>
                        <div class="kpi-label">Medicines Linked</div>
                        <div class="kpi-bar"><span class="kpi-bar-fill" id="kpiLinkedBar"></span></div>
                        <div class="kpi-foot" id="kpiLinkedFoot">&nbsp;</div>
                    </article>

                    <article class="kpi-card k-amber">
                        <div class="kpi-top">
                            <span class="kpi-icon"><i class="fas fa-clock"></i></span>
                            <span class="kpi-trend">lead time</span>
                        </div>
                        <div class="kpi-value" id="kpiLead">0</div>
                        <div class="kpi-label">Avg Lead Time (days)</div>
                        <div class="kpi-bar"><span class="kpi-bar-fill" id="kpiLeadBar"></span></div>
                        <div class="kpi-foot" id="kpiLeadFoot">&nbsp;</div>
                    </article>
                </section>

                <div class="supplier-grid" id="supplierGrid">
                </div>
            </main>
        </div>
    </div>

    <div class="app-scrim" id="appScrim"></div>

    <!-- Add / edit supplier -->
    <div class="modal fade" id="supplierModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--brand-indigo), #7a4bf0); color:#fff;">
                    <h5 class="modal-title"><i class="fas fa-truck-medical"></i> <span id="supplierModalTitle">Add supplier</span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="supplierForm">
                        <input type="hidden" id="supplierId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Supplier name *</label>
                                <input type="text" class="form-control" id="supplierName" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Contact person</label>
                                <input type="text" class="form-control" id="supplierContact">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="supplierEmail">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="supplierPhone">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" id="supplierCity">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Lead time (days)</label>
                                <input type="number" class="form-control" id="supplierLead" min="0" value="7">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Rating (0-5)</label>
                                <input type="number" step="0.1" min="0" max="5" class="form-control" id="supplierRating" value="4">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn-brand" id="saveSupplierBtn"><i class="fas fa-check"></i> Save supplier</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supplier detail -->
    <div class="modal fade" id="supplierDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header" style="background: linear-gradient(135deg, var(--brand-indigo), #7a4bf0); color:#fff;">
                    <h5 class="modal-title"><i class="fas fa-boxes-stacked"></i> Supplied medicines</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="supplierDetail"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/suppliers.js"></script>
</body>
</html>
